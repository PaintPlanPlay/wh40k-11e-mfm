name: Scrape MFM

# Paint Plan Play's fork: every scrape that finds a change is committed straight to
# `main`, without a pull request. The review happens downstream, when Paint Plan Play
# publishes a Dataset release built from this data; this repository only has to be
# fast and faithful. See README.md.
#
# Repository configuration:
#   secrets.BOT_TOKEN  fine-grained token: Issues (write) on PaintPlanPlay/paintplanplay,
#                      Actions (write) on PaintPlanPlay/dataset. Without it the data is
#                      still committed; only the issue and the dataset rebuild are skipped.

on:
  schedule:
    - cron: '0 4,10,16,22 * * *' # four times a day
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  TRACKER: PaintPlanPlay/paintplanplay
  DATASET: PaintPlanPlay/dataset

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Snapshot current data
        run: |
          mkdir -p /tmp/old-data
          cp -r data/. /tmp/old-data/ 2>/dev/null || true

      # No sticky PR here: `main` itself carries the `firstSeen` stamps, so a run that
      # finds nothing new reproduces `data/` byte for byte and commits nothing.
      - name: Scrape
        run: pnpm scrape --report /tmp/failures.md

      - name: Generate changelog
        id: changelog
        run: |
          pnpm exec tsx src/diff.ts /tmp/old-data data --title-file /tmp/title.txt > /tmp/changelog.md
          echo "version=$(sed -n 's/^MFM v\([^ ]*\) .*/\1/p' /tmp/title.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md

      - name: Update the changelog
        run: pnpm exec tsx scripts/update-data-changelog.ts /tmp/old-data data

      - name: Commit on change
        id: commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data changelog DATA-CHANGELOG.md)" ]; then
            echo "No change in the MFM."
            exit 0
          fi
          { echo "data: $(cat /tmp/title.txt)"; echo; cat /tmp/changelog.md; } > /tmp/message.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data changelog DATA-CHANGELOG.md
          git commit -q -F /tmp/message.txt
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One issue per MFM version on Paint Plan Play's tracker: the first change opens
      # it, later changes to the same version are added to it as comments.
      - name: Tell Paint Plan Play
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "No BOT_TOKEN: no issue."; exit 0; fi
          { echo "New MFM data, committed as $COMMIT_URL."; echo; cat /tmp/changelog.md; } > /tmp/body.md
          issue="MFM v$VERSION — nouvelles données"
          number=$(gh issue list --repo "$TRACKER" --state open --label mfm-update --json number,title \
            --jq "[.[] | select(.title == \"$issue\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$TRACKER" --body-file /tmp/body.md
          else
            gh issue create --repo "$TRACKER" --title "$issue" --label mfm-update --body-file /tmp/body.md
          fi

      - name: Rebuild the Dataset
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No BOT_TOKEN: no rebuild."; exit 0; fi
          gh workflow run update.yml --repo "$DATASET"

      # Only a failure before the commit is a scrape failure: a token problem in the two
      # steps above must not report the source markup as drifted.
      - name: Open issue on failure
        if: failure() && steps.commit.outcome != 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.TRACKER.split('/');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let details = '';
            try { details = fs.readFileSync('/tmp/failures.md', 'utf8').trim(); } catch {}
            const body = [
              'The scheduled MFM scrape failed — the source site markup may have drifted, or a faction stopped parsing.',
              '',
              `**Run log:** ${run}`,
              '',
              details || '_No per-faction detail was captured — the run likely failed before parsing (network, browser launch, or the index page itself). Check the run log._',
              '',
              '---',
              `To fix, follow \`.agents/playbooks/diagnose-parse.md\` in ${context.repo.owner}/${context.repo.repo}. Each block above is the located parser error (including any unconsumed-content report from the completeness check).`,
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title: `Scrape MFM failed (${new Date().toISOString().slice(0, 10)})`,
              labels: ['scrape-failure'],
              body,
            });
